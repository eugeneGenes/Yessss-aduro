<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belaqua with Cloves</title>
<style>
  :root {
    --bg1: #fff1f3;
    --bg2: #ffe0e6;
    --ink: #3b1f2b;
    --accent: #e11d48;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #2a1218;
      --bg2: #3d1824;
      --ink: #ffe9ee;
      --accent: #fb7185;
      --card: #4a1d2b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card {
    position: relative;
    z-index: 2;
    background: var(--card);
    width: min(92vw, 380px);
    padding: 24px 22px 28px;
    border-radius: 28px;
    text-align: center;
    box-shadow: 0 18px 50px rgba(225, 29, 72, .25);
  }
  .photo {
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 20px;
    background: var(--bg1);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .missing { font-size: 15px; opacity: .7; padding: 20px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { margin: 0 0 16px; opacity: .8; font-size: 15px; }
  .price {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 30px;
    font-weight: 800;
    padding: 8px 22px;
    border-radius: 999px;
    letter-spacing: .5px;
  }
  .smile { font-size: 22px; margin-top: 14px; }
  #sky { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #sky span { position: absolute; left: 0; top: 0; will-change: transform; user-select: none; }
</style>
</head>
<body>

<main class="card">
  <div class="photo">
    <img src="bottle.jpg" alt="Belaqua bottle with cloves"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'missing',textContent:'Add your photo as bottle.jpg'}))">
  </div>
  <h1>Belaqua with Cloves</h1>
  <p class="sub">Fresh, clean and full of flavour</p>
  <div class="price">¢2,500</div>
  <div class="smile">😊 😊 😊</div>
</main>

<div id="sky" aria-hidden="true"></div>

<script>
  // Emojis bounce around the screen and rebound off every edge.
  var sky = document.getElementById('sky');
  var items = [];
  var faces = ['🍓','😊','🍓','😄','🍓','😊','🍓','😁','🍓','😊','🍓','😄'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  faces.forEach(function (face, i) {
    var el = document.createElement('span');
    el.textContent = face;
    var size = 26 + Math.random() * 26;
    el.style.fontSize = size + 'px';
    sky.appendChild(el);
    var speed = 1.2 + Math.random() * 2.2;
    var angle = Math.random() * Math.PI * 2;
    items.push({
      el: el,
      size: size,
      x: Math.random() * (innerWidth - size),
      y: Math.random() * (innerHeight - size),
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed
    });
  });

  function tick() {
    var w = innerWidth, h = innerHeight;
    items.forEach(function (it) {
      if (!reduce) {
        it.x += it.vx;
        it.y += it.vy;
      }
      var maxX = w - it.size * 1.2, maxY = h - it.size * 1.3;
      if (it.x < 0)    { it.x = 0;    it.vx = Math.abs(it.vx); }
      if (it.x > maxX) { it.x = maxX; it.vx = -Math.abs(it.vx); }
      if (it.y < 0)    { it.y = 0;    it.vy = Math.abs(it.vy); }
      if (it.y > maxY) { it.y = maxY; it.vy = -Math.abs(it.vy); }
      it.el.style.transform = 'translate(' + it.x + 'px,' + it.y + 'px)';
    });
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
